site_name: RooAGI Agent Supervisor
site_description: Run agent tools with timeouts, output limits, cancellation, and process cleanup.
site_url: https://rooagi.github.io/agent-supervisor/
repo_url: https://github.com/RooAGI/agent-supervisor
repo_name: RooAGI/agent-supervisor
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Use with agent SDKs: api-boundaries.md
      - MCP servers: mcp.md
      - OpenShell developer adapter: openshell.md
  - API reference:
      - Core Concept: api-reference.md
      - Rust API: rust-api.md
      - Python API: python-api.md
  - Documents:
      - Security:
          - Security model: security-model.md
          - Filesystem and network: network-host-mode.md
      - Operations:
          - Supervisor lifecycle: supervisor-lifecycle.md
          - Process groups and resources: process-groups.md
          - Testing and coverage: testing.md
  - Releases:
      - 0.2.0: releases/0.2.0.md
      - 0.1.3: releases/0.1.3.md
      - 0.1.2: releases/0.1.2.md
      - 0.1.1: releases/0.1.1.md
      - 0.1.0: releases/0.1.0.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RooAGI/agent-supervisor
      name: RooAGI Agent Supervisor on GitHub

copyright: Apache-2.0 licensed · Built by <a href="https://www.rooagi.com">RooAGI</a>
