[package]
name = "agent-supervisor"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
description = "Policy-driven process isolation and supervision for RooAGI runtimes"
documentation = "https://rooagi.github.io/agent-supervisor/"
homepage = "https://rooagi.github.io/agent-supervisor/"
repository = "https://github.com/RooAGI/agent-supervisor"
exclude = ["dev/**", "python/**"]

[dependencies]
futures = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "time"] }
tokio-util = "0.7"
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
loom = "0.7"
proptest = "1"
serde_json = "1"
tempfile = "3"
