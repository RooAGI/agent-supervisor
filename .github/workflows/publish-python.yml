name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Align package metadata with the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"release tag must start with v, got {tag!r}")
          version = tag[1:]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"release tag must be vMAJOR.MINOR.PATCH, got {tag!r}")

          for name in ("Cargo.toml", "python/Cargo.toml", "python/pyproject.toml"):
              path = Path(name)
              contents = path.read_text()
              updated, count = re.subn(
                  r'(?m)^version = "[^\"]+"$',
                  f'version = "{version}"',
                  contents,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"could not set exactly one package version in {name}")
              path.write_text(updated)
          PY
      - name: Install maturin
        run: python -m pip install maturin
      - name: Build wheel
        run: python -m maturin build --release --compatibility pypi --manifest-path python/Cargo.toml --interpreter python --out dist
      - name: Install wheel and run Python API tests
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m unittest discover -s python/tests -v
      - name: Build source distribution
        if: runner.os == 'Linux'
        run: python -m maturin sdist --manifest-path python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-supervisor
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
