name: ci

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Check Python binding formatting
        run: cargo fmt --manifest-path python/Cargo.toml -- --check
      - name: Install maturin
        run: python -m pip install maturin
      - name: Build Python wheel
        run: python -m maturin build --manifest-path python/Cargo.toml --interpreter python
      - name: Install wheel and run Python API tests
        shell: bash
        run: |
          python -m pip install --no-deps python/target/wheels/*.whl
          python -m unittest discover -s python/tests -v

  mcp-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python MCP extras and package
        working-directory: python
        run: python -m pip install -e '.[mcp,fastmcp]'
      - name: Run official MCP and FastMCP adapter tests
        run: python -m unittest discover -s python/tests -v
      - name: Build Rust rmcp server example
        run: cargo build --manifest-path examples/rust/rmcp-server/Cargo.toml --locked
      - name: Exercise Rust rmcp server with official Python MCP client
        run: python examples/rust/rmcp-server/check.py examples/rust/rmcp-server/target/debug/agent-supervisor-rmcp-example

  openai-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenAI Agents SDK and build tools
        run: python -m pip install maturin openai-agents
      - name: Build Python wheel
        run: python -m maturin build --manifest-path python/Cargo.toml --interpreter python
      - name: Install wheel and test OpenAI Runner adapter
        shell: bash
        run: |
          python -m pip install --no-deps python/target/wheels/*.whl
          python -m unittest discover -s python/tests -p 'test_openai.py' -v

  openshell-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run OpenShell adapter unit tests without a live gateway
        run: cargo test --manifest-path dev/openshell-adapter/Cargo.toml --locked

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test --all-targets -- --test-threads=1
        timeout-minutes: 5
      - run: cargo test --features wasm --all-targets -- --test-threads=1
        timeout-minutes: 10
      - name: Run platform network integration test
        if: runner.os == 'Windows'
        run: cargo test --test windows_filesystem -- --test-threads=1
      - name: Run platform network integration test
        if: runner.os == 'macOS'
        run: cargo test --test macos_filesystem -- --test-threads=1
      - name: Run platform network integration test
        if: runner.os == 'Linux'
        run: cargo test --test linux_filesystem -- --test-threads=1
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
