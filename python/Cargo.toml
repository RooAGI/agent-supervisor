[package]
name = "agent-supervisor-python"
version = "0.1.2"
edition = "2021"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
agent-supervisor = { path = ".." }
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["io-util", "rt", "sync"] }
tokio-util = "0.7"
