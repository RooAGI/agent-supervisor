[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "agent-supervisor"
version = "0.2.0"
description = "Policy-driven process isolation and supervision for agent runtimes"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.optional-dependencies]
mcp = ["mcp>=1.22,<3"]
fastmcp = ["fastmcp>=2,<5"]
openai = ["openai-agents>=0.0.4"]
microsoft = ["agent-framework-openai>=1.0,<2"]
langgraph = ["langgraph>=1.0,<2"]
pydantic-ai = ["pydantic-ai>=1.0,<3"]
google-adk = ["google-adk>=1.0,<3"]

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "."
module-name = "agent_supervisor._native"
features = ["pyo3/extension-module"]
