[package]
name = "agent-supervisor-openshell-dev"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Developer preview OpenShell adapter for agent-supervisor"
repository = "https://github.com/RooAGI/agent-supervisor"

[dependencies]
agent-supervisor = { path = "../..", version = "0.1.1" }
futures = "0.3"
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell.git", tag = "v0.1.2" }
prost-types = "0.14"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
