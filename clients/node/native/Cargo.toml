[package]
name = "agent-supervisor-node-native"
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
agent-supervisor = { path = "../../.." }
napi = { version = "3", features = ["napi9", "tokio_rt", "serde-json"] }
napi-derive = "3"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tokio-util = "0.7"

[build-dependencies]
napi-build = "2"
